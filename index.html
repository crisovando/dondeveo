<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Donde veo</title>

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#060607" />
    <meta name="description" content="Buscador de peliculas y sus plataformas para verlas" />

    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&amp;family=Inter:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&amp;display=swap"
      rel="stylesheet"
    />

    <meta name="og:title" content="Donde veo la peli" />
    <meta name="og:description" content="Buscador de peliculas y sus plataformas para verlas" />
    <meta name="og:image" content="https://dondeveo.vercel.app/og.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@crisovando" />
    <meta
      name="twitter:description"
      content="Buscador de peliculas y sus plataformas para verlas"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        overscroll-behavior-y: contain;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
      }

      h1,
      h2,
      h3,
      h4 {
        font-family: Epilogue, system-ui, sans-serif;
      }

      #app {
        display: flex;
        flex-direction: column;
        min-height: 100svh;
      }

      .header {
        position: fixed;
        top: 0;
        z-index: 50;
        width: 100%;
        height: 80px;
        display: flex;
        align-items: center;
        background: transparent;
        color: white;
        padding-right: 4rem;
      }

      .logo-container {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding-left: 1rem;
        padding-top: 10px;
        cursor: pointer;
      }

      .logo {
        height: 50px;
        margin-bottom: 10px;
      }

      .logo-text {
        height: 40px;
        margin-bottom: 0;
      }

      .hamburgerButton {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        width: 1.5rem;
        height: 20px;
        padding: 0;
        cursor: pointer;
        background: transparent;
        border: none;
        transition: transform 0.3s;
      }

      .icon-search {
        height: 32px;
        width: 32px;
        padding-top: 4px;
        view-transition-name: search-icon;
        cursor: pointer;
      }

      @view-transition {
        navigation: auto;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <header>
        <div class="logo-container">
          <img src="/logo.svg" class="logo" alt="Logo" />
          <img
            src="/logo-text.svg"
            class="logo-text"
            alt="Donde veo"
            fetchpriority="high"
            width="200"
            height="50"
          />
        </div>
      </header>
    </div>

    <script prerender type="module" src="/src/index.tsx"></script>
  </body>
</html>
